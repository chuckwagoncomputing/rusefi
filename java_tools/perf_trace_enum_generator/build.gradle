apply from: dependenciesPath

defaultTasks 'shadowJar'

dependencies {
    implementation global_libs.annotations
    implementation project(':enum_to_string')
}

shadowJar {
    archiveBaseName = 'PerfTraceEnumGenerator'
    archiveClassifier = ''

    manifest {
        attributes(
            'Main-Class': 'com.rusefi.PerfTraceEnumGenerator',
        )
    }
}